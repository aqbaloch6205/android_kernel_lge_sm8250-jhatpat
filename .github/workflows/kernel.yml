name: LG SM8250 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev \
          libncurses5-dev zip python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Fetch Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Detect Kernel Version
        id: info
        run: |
          V=$(grep "^VERSION =" Makefile | awk '{print $3}')
          P=$(grep "^PATCHLEVEL =" Makefile | awk '{print $3}')
          S=$(grep "^SUBLEVEL =" Makefile | awk '{print $3}')
          echo "KVER=$V.$P.$S" >> $GITHUB_OUTPUT

      - name: Build Kernel
        env:
          # We place the system bin folder FIRST so the build uses the system's 'ld' (linker)
          # while still using Proton Clang for the actual compilation.
          PATH: /usr/bin:${{ github.workspace }}/toolchain/bin:/bin
        run: |
          DEFCONFIG="vendor/timelm_defconfig"
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Initialize Config
          make O=out $DEFCONFIG
          
          # Compile
          # Notice we explicitly tell it to use the system linker (LD=ld.lld or LD=ld)
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               CROSS_COMPILE=$CROSS_COMPILE \
               CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
               Image.gz

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-v${{ steps.info.outputs.KVER }}
          path: out/arch/arm64/boot/Image.gz
          
