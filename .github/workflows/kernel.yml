name: Build Kernel (r547379)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio \
        libssl-dev tar python3 device-tree-compiler libelf-dev

    - name: Setup Google Clang (r547379)
      run: |
        mkdir -p $HOME/toolchains/clang
        cd $HOME/toolchains/clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
        tar -zxf clang-r547379.tar.gz
        cd $GITHUB_WORKSPACE

    - name: Build kernel
      run: |
        # Pass the toolchain path to your script
        export CLANG_PATH=$HOME/toolchains/clang
        bash build.sh

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LGV60-Kernel-Build
        path: |
          *.zip
          out/arch/arm64/boot/Image
          out/arch/arm64/boot/dts/vendor/qcom/*.dtb
        if-no-files-found: warn
